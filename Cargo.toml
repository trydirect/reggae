[package]
name = "reggae"
version = "0.1.0"
edition = "2021"
description = "Cross-registrar domain manager CLI"
license = "MIT"

[[bin]]
name = "reggae"
path = "src/main.rs"

[lib]
name = "reggae"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
tokio-cron-scheduler = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
async-trait = "0.1"
tabled = "0.16"
colored = "2"
clap_complete = "4"
dirs = "5"

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
